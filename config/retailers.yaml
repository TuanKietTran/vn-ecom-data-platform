# First-party retailers tracked through schema.org Product JSON-LD on their product pages.
# Discovery: robots.txt `Sitemap:` lines (+ extra_sitemaps), recursing sitemap indexes, keeping URLs
# matching `product_url`. Each run fetches a *stable* sample (first RETAIL_MAX_PRODUCTS URLs, sorted)
# so the same SKUs build a continuous price history. Regexes are starting points — tune per site.
retailers:
  thegioididong:
    base_url: https://www.thegioididong.com
    product_url: '^https://www\.thegioididong\.com/(dtdd|may-tinh-bang|laptop|tai-nghe|dong-ho-thong-minh|sac-dtdd|loa-laptop)/[a-z0-9-]+$'
    default_category: phone_tablet
  dienmayxanh:
    base_url: https://www.dienmayxanh.com
    product_url: '^https://www\.dienmayxanh\.com/(tivi|tu-lanh|may-giat|may-lanh|noi-chien-khong-dau|noi-com-dien|may-loc-khong-khi|quat-dieu-hoa)/[a-z0-9-]+$'
    default_category: home_appliance
  bachhoaxanh:
    base_url: https://www.bachhoaxanh.com
    product_url: '^https://www\.bachhoaxanh\.com/[a-z0-9-]+/[a-z0-9-]+$'
    default_category: grocery
  fptshop:
    base_url: https://fptshop.com.vn
    product_url: '^https://fptshop\.com\.vn/(dien-thoai|may-tinh-xach-tay|may-tinh-bang|phu-kien)/[a-z0-9-]+$'
    default_category: phone_tablet
  cellphones:
    base_url: https://cellphones.com.vn
    product_url: '^https://cellphones\.com\.vn/[a-z0-9-]+\.html$'
    default_category: phone_tablet
  hasaki:
    base_url: https://hasaki.vn
    product_url: '^https://hasaki\.vn/san-pham/[a-z0-9-]+\.html$'
    default_category: beauty
  fahasa:
    base_url: https://www.fahasa.com
    product_url: '^https://www\.fahasa\.com/[a-z0-9-]+\.html$'
    default_category: books
