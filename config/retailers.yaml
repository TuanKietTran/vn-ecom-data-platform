# First-party retailers tracked through schema.org Product JSON-LD on their product pages.
# Discovery: robots.txt `Sitemap:` lines (+ extra_sitemaps), recursing sitemap indexes, keeping URLs
# matching `product_url`. Each run fetches a *stable* sample (first RETAIL_MAX_PRODUCTS URLs, sorted)
# so the same SKUs build a continuous price history. Regexes are starting points — tune per site.
retailers:
  thegioididong:
    base_url: https://www.thegioididong.com
    product_url: '^https://www\.thegioididong\.com/(dtdd|may-tinh-bang|laptop|tai-nghe|dong-ho-thong-minh|sac-dtdd|loa-laptop|bo-luu-dien|man-hinh-may-tinh|op-lung-flipcover)/[a-z0-9-]+$'
    default_category: phone_tablet
  dienmayxanh:
    base_url: https://www.dienmayxanh.com
    # Product sitemap also uses specialist routes such as robot-hut-bui and ghe-gaming-ghe-cong-thai-hoc.
    product_url: '^https://www\.dienmayxanh\.com/(tivi|tu-lanh|may-giat|may-lanh|noi-chien-khong-dau|noi-com-dien|may-loc-khong-khi|quat-dieu-hoa|bep-tu|chao-chong-dinh|dan-loa-dvd|dien-thoai|dong-ho-deo-tay|dong-ho-thong-minh|ghe-gaming-ghe-cong-thai-hoc|may-hut-am|may-hut-mui|may-loc-nuoc|mieng-dan-man-hinh|op-lung-flipcover|quat|robot-hut-bui|tai-nghe|tui-chong-soc|vot-muoi|xe-dap)/[a-z0-9-]+$'
    default_category: home_appliance
  bachhoaxanh:
    base_url: https://www.bachhoaxanh.com
    product_url: '^https://www\.bachhoaxanh\.com/[a-z0-9-]+/[a-z0-9-]+$'
    default_category: grocery
  fptshop:
    base_url: https://fptshop.com.vn
    # The product sitemap indexes phone, appliance and software product families.
    product_url: '^https://fptshop\.com\.vn/(dien-thoai|may-tinh-xach-tay|may-tinh-bang|phu-kien|dien-gia-dung|phan-mem)/[a-z0-9-]+$'
    default_category: phone_tablet
  cellphones:
    base_url: https://cellphones.com.vn
    product_url: '^https://cellphones\.com\.vn/[a-z0-9-]+\.html$'
    default_category: phone_tablet
  hasaki:
    base_url: https://hasaki.vn
    product_url: '^https://hasaki\.vn/san-pham/[a-z0-9-]+\.html$'
    default_category: beauty
  fahasa:
    base_url: https://www.fahasa.com
    # Fahasa groups products under department paths (e.g. /sach/...html), not only at /.
    product_url: '^https://www\.fahasa\.com/(?:[a-z0-9-]+/)*[a-z0-9-]+\.html$'
    default_category: books
