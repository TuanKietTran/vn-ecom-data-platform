[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vnecom"
version = "0.1.0"
description = "Template data platform for tracking Vietnamese e-commerce (Shopee, Lazada, Tiki, TikTok Shop, Sendo) — medallion lake on PySpark + dbt, orchestrated by Dagster or Airflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "pyyaml>=6.0",
  "fsspec>=2024.6",
  "pyarrow>=16",
  "pandas>=2.2",
  "duckdb>=1.1",
  "typer>=0.12",
]

[project.optional-dependencies]
spark = ["pyspark>=4.0,<4.1", "delta-spark>=4.0,<4.1"]
dbt = ["dbt-core>=1.9", "dbt-duckdb>=1.9", "deltalake>=0.22"]
dagster = ["dagster>=1.9", "dagster-webserver>=1.9", "dagster-dbt>=0.25", "dagster-postgres>=0.25", "psycopg[binary]>=3.1"]
s3 = ["s3fs>=2024.6"]
stream = ["confluent-kafka>=2.5"]
ai = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.1", "grpcio>=1.64", "grpcio-tools>=1.64", "protobuf>=5", "langgraph>=0.2", "langgraph-checkpoint-postgres>=2", "langgraph-checkpoint-sqlite>=2", "langchain-core>=0.3", "psycopg[binary,pool]>=3.2", "pgvector>=0.3", "boto3>=1.34", "sqlglot>=25"]
ai-eval = ["ragas>=0.2", "deepeval>=1.0", "langfuse>=2", "opentelemetry-api>=1.25"]
ai-local = ["sentence-transformers>=3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pytest-asyncio>=0.24", "testcontainers>=4", "build>=1.2", "faker>=26"]
lite = ["vnecom[spark,dbt,dagster,dev]"]
all = ["vnecom[spark,dbt,dagster,s3,stream,ai,ai-eval,dev]"]

[project.scripts]
vnecom = "vnecom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vnecom"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["transform/dbt/target", "transform/dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/vnecom/ai"]
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs a local Spark (JVM)"]

[tool.dagster]
module_name = "vnecom_dagster.definitions"
code_location_name = "vnecom"
