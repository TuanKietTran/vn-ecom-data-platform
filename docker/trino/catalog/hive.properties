# Gold (Parquet written by dbt-duckdb, one folder per mart)
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://vnecom-lake/_trino_metastore/hive
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
hive.non-managed-table-writes-enabled=false
