# Deploy tiers are compose profiles (the Makefile sets COMPOSE_PROFILES from TIER + ORCH):
#   standard = core + one orchestrator      make up TIER=standard ORCH=dagster|airflow
#   full     = standard + trino/superset/redpanda/streaming
# lite tier runs without containers (make demo / make dagster-dev).
name: vnecom

x-platform-env: &platform-env
  VNECOM_TIER: ${VNECOM_TIER:-standard}
  VNECOM_LAKE_URI: s3a://vnecom-lake
  VNECOM_TABLE_FORMAT: ${VNECOM_TABLE_FORMAT:-delta}
  VNECOM_SOURCES: ${VNECOM_SOURCES:-synthetic}
  VNECOM_HTTP_USER_AGENT: ${VNECOM_HTTP_USER_AGENT:-vnecom-tracker/0.1}
  TIKI_CATEGORY_IDS: ${TIKI_CATEGORY_IDS:-}
  SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
  SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
  SHOPEE_SHOP_ID: ${SHOPEE_SHOP_ID:-}
  SHOPEE_ACCESS_TOKEN: ${SHOPEE_ACCESS_TOKEN:-}
  LAZADA_APP_KEY: ${LAZADA_APP_KEY:-}
  LAZADA_APP_SECRET: ${LAZADA_APP_SECRET:-}
  LAZADA_ACCESS_TOKEN: ${LAZADA_ACCESS_TOKEN:-}
  TIKTOK_APP_KEY: ${TIKTOK_APP_KEY:-}
  TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
  TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
  TIKTOK_SHOP_CIPHER: ${TIKTOK_SHOP_CIPHER:-}
  FEED_VENDOR: ${FEED_VENDOR:-}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-vnecom}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me-please}
  AWS_ENDPOINT_URL: http://minio:9000
  AWS_REGION: us-east-1
  SPARK_MASTER: spark://spark-master:7077
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
  DBT_TARGET: minio
  POSTGRES_USER: ${POSTGRES_USER:-vnecom}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}

x-platform: &platform
  image: vnecom/platform:local
  build: { context: .., dockerfile: docker/platform.Dockerfile }
  environment: *platform-env
  volumes:
    - warehouse:/opt/vnecom/warehouse
    - ivy:/opt/ivy
  restart: unless-stopped

x-airflow-env: &airflow-env
  <<: *platform-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-vnecom}:${POSTGRES_PASSWORD:-change-me-please}@postgres:5432/airflow
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-please-32-bytes-minimum!!}
  # local template: every user is admin, no login. Configure a real auth manager before exposing it.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

x-airflow: &airflow
  image: vnecom/airflow:local
  build: { context: .., dockerfile: docker/airflow.Dockerfile }
  environment: *airflow-env
  volumes:
    - ../orchestration/airflow/dags:/opt/airflow/dags:ro
    - warehouse:/opt/vnecom/warehouse
    - ivy:/opt/ivy
  depends_on:
    airflow-init: { condition: service_completed_successfully }
  restart: unless-stopped
  profiles: [airflow]

services:
  # ── core (standard + full) ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vnecom}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 10
    profiles: [core]

  minio-init:
    image: minio/mc:latest
    entrypoint: /bin/sh /init.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vnecom}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    volumes: [./minio/init.sh:/init.sh:ro]
    depends_on: { minio: { condition: service_healthy } }
    profiles: [core]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vnecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      POSTGRES_DB: ${POSTGRES_DB:-vnecom}
    volumes:
      - pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 20
    profiles: [core]

  spark-master:
    <<: *platform
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["8081:8080", "7077:7077"]
    profiles: [core]

  spark-worker:
    <<: *platform
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES:-2}", "--memory", "${SPARK_WORKER_MEMORY:-3g}"]
    depends_on: [spark-master]
    profiles: [core]

  # ── Dagster (ORCH=dagster) ─────────────────────────────────────────────
  dagster-webserver:
    <<: *platform
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/vnecom/docker/dagster/workspace.yaml"]
    ports: ["3000:3000"]
    volumes:
      - warehouse:/opt/vnecom/warehouse
      - ivy:/opt/ivy
      - ./dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./dagster/workspace.yaml:/opt/vnecom/docker/dagster/workspace.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    profiles: [dagster]

  dagster-daemon:
    <<: *platform
    command: ["dagster-daemon", "run", "-w", "/opt/vnecom/docker/dagster/workspace.yaml"]
    volumes:
      - warehouse:/opt/vnecom/warehouse
      - ivy:/opt/ivy
      - ./dagster/dagster.yaml:/opt/dagster/home/dagster.yaml:ro
      - ./dagster/workspace.yaml:/opt/vnecom/docker/dagster/workspace.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    profiles: [dagster]

  # ── Airflow 3 (ORCH=airflow) ───────────────────────────────────────────
  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: ["airflow", "api-server"]
    ports: ["8080:8080"]

  airflow-scheduler:
    <<: *airflow
    command: ["airflow", "scheduler"]

  airflow-dag-processor:
    <<: *airflow
    command: ["airflow", "dag-processor"]

  airflow-triggerer:
    <<: *airflow
    command: ["airflow", "triggerer"]

  # ── full tier: query + BI + streaming ─────────────────────────────────
  trino:
    image: trinodb/trino:latest
    ports: ["8085:8080"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-vnecom}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me-please}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/register_tables.sql:/opt/register_tables.sql:ro
    depends_on: { minio-init: { condition: service_completed_successfully } }
    profiles: [full]

  superset:
    image: apache/superset:latest
    entrypoint: ["/bin/bash", "/app/bootstrap.sh"]
    ports: ["8088:8088"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-please}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-change-me-please}
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_USER:-vnecom}:${POSTGRES_PASSWORD:-change-me-please}@postgres:5432/superset
    volumes:
      - ./superset/bootstrap.sh:/app/bootstrap.sh:ro
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      postgres: { condition: service_healthy }
      trino: { condition: service_started }
    profiles: [full]

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports: ["19092:19092"]
    profiles: [full]

  price-producer:
    <<: *platform
    command: ["python", "-m", "vnecom.stream.producer", "--bootstrap", "redpanda:9092"]
    depends_on: [redpanda]
    profiles: [full]

  price-stream:
    <<: *platform
    command: ["python", "-m", "vnecom.spark.stream_prices", "--bootstrap", "redpanda:9092"]
    depends_on: [redpanda, spark-master, minio-init]
    profiles: [full]

volumes:
  minio:
  pg:
  warehouse:
  ivy:
